plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sovworks.eds.android'
    compileSdk 37
    ndkVersion '29.0.14206865'

    defaultConfig {
        applicationId "com.sovworks.eds.android"
        // 29 (Android 10): oldest version supported by this fork.
        minSdk 29
        targetSdk 37
        versionCode 300
        versionName "3.0.0-alpha1"

        ndk {
            abiFilters 'x86_64', 'armeabi-v7a', 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                targets "edsxts", "edsctr", "edsaes", "edsserpent", "edstwofish", "edsripemd160",
                        "edswhirlpool", "fdraio", "localxts", "edscfb", "edscbc", "edsgost", "edsext4", "edsluks"
            }
        }
    }

    signingConfigs {
        debug {
            storeFile file('../misc/keys.keystore')
            storePassword 'android'
            keyAlias 'eds-debug-key'
            keyPassword 'android'
        }
    }

    flavorDimensions = ["fullOrLite"]
    productFlavors {
        lite {
            dimension "fullOrLite"
            applicationId "com.sovworks.edslite"
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules-lite.pro'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            externalNativeBuild {
                cmake {
                    cFlags "-DDEBUG"
                }
            }
            debuggable true
            jniDebuggable true
        }
    }

    buildFeatures {
        buildConfig true
    }

    packaging {
        resources {
            excludes += ['META-INF/LICENSE.txt', 'META-INF/LICENSE', 'META-INF/NOTICE.txt', 'META-INF/NOTICE']
        }
    }

    lint {
        abortOnError false
    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
            version "3.31.6"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.drewnoakes:metadata-extractor:2.22.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.core:core:1.19.1'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    implementation 'androidx.documentfile:documentfile:1.1.0'
    implementation 'androidx.exifinterface:exifinterface:1.4.2'
    implementation 'androidx.annotation:annotation:1.11.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'
    implementation 'io.reactivex.rxjava2:rxjava:2.2.21'
    implementation 'com.trello.rxlifecycle3:rxlifecycle:3.1.0'
    implementation 'com.trello.rxlifecycle3:rxlifecycle-android:3.1.0'
    implementation 'com.trello.rxlifecycle3:rxlifecycle-components:3.1.0'
}

if (file('build-local.gradle').exists()) {
    apply from: 'build-local.gradle'
}
